name: Flutter Deploy

on:
  # push trigger - DISABLED by RE408: TestFlight / Play deploys now run on our own runners
  # in the RE board's Deploy flow (bin/deploy_ios.sh, bin/deploy_android.sh). Manual
  # workflow_dispatch runs still work. Re-enable by uncommenting the push block below.
#   push:
#     branches:
#       - main
#     paths:
#       - 'flutter/**'
#       - '.github/workflows/flutter-deploy.yml'
  workflow_dispatch:

jobs:
  # Shared validation and analysis (quick, cheap)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
          cache-key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.lock') }}

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Run code analysis
        working-directory: flutter
        run: flutter analyze

      - name: Check code formatting
        working-directory: flutter
        run: dart format --set-exit-if-changed .

      - name: Run tests
        working-directory: flutter
        run: flutter test

  # iOS build - uploads to TestFlight and stops (no waiting on Apple's
  # processing); `distribute-ios` below handles the external Beta group.
  build-ios:
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      # Pins the exact build `distribute-ios` distributes: build number +
      # app version (pubspec `version:` before the '+').
      - name: Resolve build version
        id: version
        run: |
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "app_version=$(grep -E '^version:' flutter/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      # Apple requires apps be built with the iOS 26 SDK (Xcode 26+) for
      # App Store Connect uploads. Select the newest Xcode 26 explicitly.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
          cache-key: ${{ runner.os }}-flutter-ios-${{ hashFiles('flutter/pubspec.lock') }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: flutter/ios

      - name: Install Fastlane
        working-directory: flutter/ios
        run: |
          if ! gem list -i fastlane > /dev/null; then
            gem install fastlane
          fi

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: flutter/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('flutter/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache iOS Build
        uses: actions/cache@v4
        with:
          path: |
            flutter/ios/Pods/Flutter/Flutter.xcframework
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-ios-build-${{ hashFiles('flutter/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-build-

      - name: Setup App Store Connect API
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ vars.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Build and upload to TestFlight
        working-directory: flutter/ios
        run: |
          export FASTLANE_API_KEY_PATH="${HOME}/.appstoreconnect/private_keys/AuthKey_${{ vars.APP_STORE_CONNECT_KEY_ID }}.p8"
          fastlane deploy
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: "${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}"
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          # Public app config baked into the release build via --dart-define
          # (flutter/lib/config.dart). Not secrets — an iOS OAuth client has no
          # secret and the host is public.
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}

  # External TestFlight distribution - waits for Apple's processing of the
  # build `build-ios` uploaded, then submits it to the external Beta group.
  # App Store Connect API only, so it runs on Linux at the 1x rate.
  # Set the repo var TESTFLIGHT_EXTERNAL=false for internal testers only.
  distribute-ios:
    needs: build-ios
    if: vars.TESTFLIGHT_EXTERNAL != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: flutter/ios

      - name: Install Fastlane
        working-directory: flutter/ios
        run: |
          if ! gem list -i fastlane > /dev/null; then
            gem install fastlane
          fi

      - name: Setup App Store Connect API
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ vars.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Distribute to external TestFlight group
        working-directory: flutter/ios
        run: |
          export FASTLANE_API_KEY_PATH="${HOME}/.appstoreconnect/private_keys/AuthKey_${{ vars.APP_STORE_CONNECT_KEY_ID }}.p8"
          fastlane ios distribute_external
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ needs.build-ios.outputs.build_number }}
          APP_VERSION: ${{ needs.build-ios.outputs.app_version }}
          # Empty when the repo var is unset; the Fastfile defaults it to "Beta".
          BETA_GROUP: ${{ vars.BETA_GROUP }}

  # Android build - DISABLED for now (iOS-first; Android is deferred per RLY-103).
  # Re-enable by uncommenting the job below once the Android keystore + Play Store
  # secrets are set (ANDROID_KEYSTORE_BASE64/PASSWORD, ANDROID_KEY_PASSWORD, PLAY_STORE_CONFIG_JSON_BASE64).
